name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Go checks (shared internal)
        working-directory: internal
        run: |
          go mod verify
          go vet ./...
          go test ./...

      - name: Go checks (api service)
        working-directory: services/api
        run: |
          go mod verify
          go vet ./...
          go test ./...

      - name: Go checks (worker service)
        working-directory: services/worker
        run: |
          go mod verify
          go vet ./...
          go test ./...

      - name: Build api image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          load: true
          tags: api:ci

      - name: Build worker image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/worker/Dockerfile
          push: false
          load: true
          tags: worker:ci

      - name: Trivy filesystem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
