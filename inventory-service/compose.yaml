services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_started
volumes:
  mongo-data:
