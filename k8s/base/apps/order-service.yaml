apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ecommerce/order-service:local
          ports:
            - containerPort: 8082
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: MYSQL_PASSWORD
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: DB_NAME
            - name: DB_AUTO_MIGRATE
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: DB_AUTO_MIGRATE
            - name: DB_MIGRATIONS_PATH
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: DB_MIGRATIONS_PATH
            - name: PRODUCT_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: PRODUCT_GRPC_ADDR
            - name: INVENTORY_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: INVENTORY_GRPC_ADDR
            - name: PAYMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: PAYMENT_SERVICE_URL
            - name: OTEL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: OTEL_ENABLED
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8082
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce
spec:
  selector:
    app: order-service
  ports:
    - port: 8082
      targetPort: 8082
