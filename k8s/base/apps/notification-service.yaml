apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: ecommerce/notification-service:local
          ports:
            - containerPort: 8083
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: DB_DSN
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: DB_DSN_NOTIFICATION
            - name: DB_AUTO_MIGRATE
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: DB_AUTO_MIGRATE
            - name: DB_MIGRATIONS_PATH
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: DB_MIGRATIONS_PATH
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: RABBITMQ_URL
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8083
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: notification-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notification-data
  namespace: ecommerce
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ecommerce
spec:
  selector:
    app: notification-service
  ports:
    - port: 8083
      targetPort: 8083
