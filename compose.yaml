services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  mysql-order:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: order-service
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "5434:3306"
    volumes:
      - mysql-order-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-papp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/services/api/Dockerfile
    ports:
      - "8084:8084"
      - "9093:9093"
    environment:
      SERVER_PORT: 8084
      GRPC_PORT: 9093
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: inventory-service
    depends_on:
      mongo:
        condition: service_started

  inventory-worker:
    build:
      context: .
      dockerfile: inventory-service/services/worker/Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: inventory-service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: payment-service/services/api/Dockerfile
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      DB_DSN: file:/data/payments.db?_foreign_keys=on
      DB_AUTO_MIGRATE: "true"
      DB_MIGRATIONS_PATH: /app/migrations
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PAYMENT_STUB_DELAY_SEC: 5
    volumes:
      - payment-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: auth-service/services/api/Dockerfile
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      JWT_SECRET: dev-secret-change-me
      JWT_TTL_HOURS: 24
      DB_DSN: file:/data/auth.db?_foreign_keys=on
      DB_AUTO_MIGRATE: "true"
      DB_MIGRATIONS_PATH: /app/migrations
    volumes:
      - auth-data:/data
    depends_on: {}

  product-service:
    build:
      context: .
      dockerfile: product-service/services/api/Dockerfile
    ports:
      - "8081:8081"
      - "9091:9091"
    environment:
      SERVER_PORT: 8081
      GRPC_PORT: 9091
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: product-service
      INVENTORY_SERVICE_URL: http://inventory-service:8084
      OTEL_ENABLED: "false"
    depends_on:
      mongo:
        condition: service_started
      inventory-service:
        condition: service_started

  order-service:
    build:
      context: .
      dockerfile: order-service/services/api/Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      DB_HOST: mysql-order
      DB_PORT: 3306
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: order-service
      DB_AUTO_MIGRATE: "true"
      DB_MIGRATIONS_PATH: /app/migrations
      PRODUCT_GRPC_ADDR: product-service:9091
      INVENTORY_GRPC_ADDR: inventory-service:9093
      PAYMENT_SERVICE_URL: http://payment-service:8085
      OTEL_ENABLED: "false"
    depends_on:
      mysql-order:
        condition: service_healthy
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started

  order-worker:
    build:
      context: .
      dockerfile: order-service/services/worker/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: mysql-order
      DB_PORT: 3306
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: order-service
      INVENTORY_GRPC_ADDR: inventory-service:9093
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      mysql-order:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inventory-service:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: notification-service/services/worker/Dockerfile
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      DB_DSN: file:/data/notifications.db?_foreign_keys=on
      DB_AUTO_MIGRATE: "true"
      DB_MIGRATIONS_PATH: /app/migrations
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    volumes:
      - notification-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      REDIS_ADDR: redis:6379
      JWT_SECRET: dev-secret-change-me
      PRODUCT_SERVICE_URL: http://product-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      AUTH_SERVICE_URL: http://auth-service:8086
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-60}
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started

volumes:
  mongo-data:
  mysql-order-data:
  notification-data:
  payment-data:
  auth-data:
