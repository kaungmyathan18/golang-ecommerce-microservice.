apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ecommerce/auth-service:local
          ports:
            - containerPort: 8086
          env:
            - name: SERVER_PORT
              value: "8086"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: JWT_SECRET
            - name: JWT_TTL_HOURS
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: JWT_TTL_HOURS
            - name: DB_DSN
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: DB_DSN_AUTH
            - name: DB_AUTO_MIGRATE
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: DB_AUTO_MIGRATE
            - name: DB_MIGRATIONS_PATH
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: DB_MIGRATIONS_PATH
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8086
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8086
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: auth-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-data
  namespace: ecommerce
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ecommerce
spec:
  selector:
    app: auth-service
  ports:
    - port: 8086
      targetPort: 8086
