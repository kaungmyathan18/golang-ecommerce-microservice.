syntax = "proto3";

package product;

option go_package = "github.com/kaungmyathan18/golang-ecommerce-microservice/proto/product/pb";

service ProductService {
  rpc GetProduct(GetProductRequest) returns (ProductResponse);
  rpc CheckStock(CheckStockRequest) returns (CheckStockResponse);
  rpc DecrementStock(DecrementStockRequest) returns (DecrementStockResponse);
}

message GetProductRequest {
  string id = 1;
}

message ProductResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  string category_id = 5;
  int32 stock = 6;
}

message CheckStockRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message CheckStockResponse {
  bool available = 1;
  int32 current_stock = 2;
}

message DecrementStockRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message DecrementStockResponse {
  bool success = 1;
  int32 remaining_stock = 2;
}
